---
bwpm_project_version: "4.3.6"

bwpm_joomla_current: "{{ joomla_version_current }}"
bwpm_joomla_previous: "{{ joomla_version_previous }}"

bwpm_joomla_sub_version_current: "{{ joomla_version_current.split('.')[0] }}{{ joomla_version_current.split('.')[1] }}"
bwpm_joomla_sub_version_previous: "{{ joomla_version_previous.split('.')[0] }}{{ joomla_version_previous.split('.')[1] }}"

bwpm_php_current: "{{ bw_php_version_current }}"
bwpm_php_previous: "{{ bw_php_version_previous }}"

bwpm_webroot_current: "j{{ joomla_version_current.split('.')[0] }}current"
bwpm_webroot_previous: "j{{ joomla_version_previous.split('.')[0] }}previous"
