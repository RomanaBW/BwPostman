---
- hosts: localhost
  connection: local
  gather_facts: no
  vars_files:
    - /repositories/systemscripts/Ansible/general_vars/general_bw_vault.yml
    - /repositories/systemscripts/Ansible/general_vars/general_joomla_versions.yml
    - ../vars/vars_previous.yml
    - ../vars/vars_previous_test.yml
    - ../vars/vars_versions.yml

  tasks:
    - name: Ensure version folder exists
      ansible.builtin.file:
        path: "{{ bwpm_base_path }}/logs/bwpostman"
        state: directory

    - name: Create compose file
      ansible.builtin.template:
        src: "compose-test.yml.j2"
        dest: "{{ bwpm_base_path }}/compose.yml"

    - name: Create Dockerfile
      ansible.builtin.template:
        src: "Dockerfile_test.j2"
        dest: "{{ bwpm_base_path }}/Dockerfile"

    - name: Create Joomla configuration
      ansible.builtin.template:
        src: "configuration_test.php.j2"
        dest: "{{ bwpm_base_path }}/configuration.php"
        mode: 0777
